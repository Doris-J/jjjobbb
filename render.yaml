services:
  - type: web
    name: interview-assistant-api
    runtime: python
    pythonVersion: "3.11"
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false        # 在 Render 控制台手动填入 Supabase 连接串
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
